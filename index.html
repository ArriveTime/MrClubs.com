<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrClubs.com — The Ultimate Directory of Clubs</title>
    <!-- Tailwind CSS for fast, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">MrClubs<span class="text-indigo-400">.com</span></h1>
                <p class="text-slate-400 text-sm mt-1">The A-to-Z Directory of Social, Recreational, and Professional Clubs</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-3">
                <button onclick="alert('Claim or submit a listing form opens here!')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    + Add / Claim Club
                </button>
            </div>
        </div>
    </header>

    <!-- Search & Filter Bar -->
    <section class="bg-white border-b border-slate-200 py-6">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Keyword Search -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Search Clubs</label>
                <input type="text" id="searchInput" placeholder="e.g. Country Club, Book Club..." onkeyup="filterListings()" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <!-- Category Filter -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Filter by Category</label>
                <select id="categoryFilter" onchange="filterListings()" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">All Categories (A-Z)</option>
                    <option value="Book Clubs">Book Clubs</option>
                    <option value="Country Clubs">Country Clubs</option>
                    <option value="Golf Clubs">Golf Clubs</option>
                    <option value="Yacht Clubs">Yacht Clubs</option>
                </select>
            </div>
            <!-- State Filter -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Filter by State</label>
                <select id="stateFilter" onchange="filterListings()" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">All States</option>
                    <option value="VA">Virginia (VA)</option>
                    <option value="CA">California (CA)</option>
                    <option value="FL">Florida (FL)</option>
                    <option value="NY">New York (NY)</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Main Directory Grid -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800" id="resultsCount">Showing all clubs</h2>
        </div>

        <div id="listingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic JavaScript inserts cards here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 mt-12 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 MrClubs.com. All rights reserved. Built on GitHub Pages.</p>
        </div>
    </footer>

    <!-- JavaScript Directory Logic -->
    <script>
        // Sample seed data (replace or expand this with your cleaned CSV data converted to JSON)
        const clubs = [
            { name: "Country Club of Virginia", category: "Country Clubs", city: "Richmond", state: "VA", phone: "(804) 288-2891", website: "#" },
            { name: "Richmond Area Book Society", category: "Book Clubs", city: "Richmond", state: "VA", phone: "(804) 555-0143", website: "#" },
            { name: "Newport Beach Yacht Club", category: "Yacht Clubs", city: "Newport Beach", state: "CA", phone: "(949) 555-0199", website: "#" },
            { name: "Silverado Golf Club", category: "Golf Clubs", city: "Napa", state: "CA", phone: "(707) 555-0122", website: "#" },
            { name: "Key West Sailing & Yacht Club", category: "Yacht Clubs", city: "Key West", state: "FL", phone: "(305) 555-0188", website: "#" }
        ];

        function renderListings(dataToRender) {
            const grid = document.getElementById('listingsGrid');
            const countLabel = document.getElementById('resultsCount');
            grid.innerHTML = '';
            countLabel.innerText = `Showing ${dataToRender.length} clubs`;

            if (dataToRender.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No clubs found matching your criteria. Try adjusting your filters.</div>`;
                return;
            }

            dataToRender.forEach(club => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full">${club.category}</span>
                            <span class="text-xs font-bold text-slate-400 uppercase">${club.state}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mt-1">${club.name}</h3>
                        <p class="text-slate-600 text-sm mt-1">${club.city}, ${club.state}</p>
                        <p class="text-slate-500 text-xs mt-3">📞 ${club.phone}</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center">
                        <a href="${club.website}" target="_blank" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">Visit Website &rarr;</a>
                        <span class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded border border-amber-200 cursor-pointer" onclick="alert('Claiming listing for: ${club.name}')">Claim Listing</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterListings() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const state = document.getElementById('stateFilter').value;

            const filtered = clubs.filter(club => {
                const matchesSearch = club.name.toLowerCase().includes(search) || club.city.toLowerCase().includes(search);
                const matchesCategory = category === "" || club.category === category;
                const matchesState = state === "" || club.state === state;
                return matchesSearch && matchesCategory && matchesState;
            });

            renderListings(filtered);
        }

        // Initial render
        renderListings(clubs);
    </script>
</body>
</html>
